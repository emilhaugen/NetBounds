[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "netbounds"
version = "0.1.0"
description = "Reproduce the numerical tables for NetBounds."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "NetBounds authors"}]
dependencies = ["torch==2.12.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
netbounds-paper = "netbounds.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
netbounds = [
  "_payload/data/**/*",
  "_payload/paper/**/*",
  "_payload/provenance/**/*",
]

[tool.pytest.ini_options]
addopts = "-ra"
markers = ["torch: requires the declared PyTorch numerical dependency"]
testpaths = ["tests"]
